:root { --bg: #0d0d0f; --surface: #17171a; --surface2: #1f1f23; --border: rgba(255,255,255,0.07); --accent: #c8f135; --accent-dim: rgba(200,241,53,0.12); --text: #f0ede6; --muted: #888880; --accent2: #4af0c4; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; height: 100vh; }
.screen { display: none; flex: 1; overflow-y: auto; }
.screen.active { display: block; }
.bottom-nav { flex-shrink: 0; display: flex; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.nav-btn { flex: 1; padding: 10px; border: none; background: none; color: var(--muted); font-size: 10px; cursor: pointer; }
.nav-btn.active { color: var(--accent); }
